<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Usuario</title>
    <link rel="stylesheet" href="./CSS/estilos.css">
    <style>
        /*Aqui iria el css local si se usuara*/
    </style>
</head>
<body>
    <header>
        <h1>Registro Usuario</h1>
    </header>
    <main>
        <div class="form-box">
            <form action="#" method="post">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Carlos Pérez" required>

                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="usuaio@dominio.com">

                <label for="pass">Contraseña:</label>
                <input type="password" id="pass" name="pass" required>

                <label for="repeat-pass">Repetir Contraseña:</label>
                <input type="password" id="repeat-pass" name="repeat-pass" required>

                <label for="fecha">Fecha Nacimiento:</label>
                <input type="date" id="fecha" name="fecha">

                <label>Genero:</label>
                <div class="radio-group">
                    <input type="radio" id="masculino" name="genero" value="masculino" required>
                    <label for="masculino">Masculino</label>
                    <input type="radio" id="femenino" name="genero" value="femenino">
                    <label for="femenino">Femenino</label>
                    <input type="radio" id="otro" name="genero" value="otro">
                    <label for="otro">Otro</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">Acepto los Términos y Condiciones</label>
                </div>

                <button id="boton" type="submit">Registrarse</button>
            </form>
        </div>
    </main>
    <footer>
        &copy; 2025 - Universidad Fidélitas - Ambiente Web Cliente Servidor
    </footer>
    
</body>
</html>

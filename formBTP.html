<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Bootstrap</title>
</head>
<body class="bg-light">
    <header class="mt-5">
        <h1 class="text-center text-primary">Registro Usuario</h1>
    </header>
    <main>
        <div class="container mt-5">
        <div class="card p-4 shadow-sm mx-auto bg-dark text-white" style="max-width: 500px;">
            <form action="#" method="post">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre Completo:</label>
                    <input  class="form-control" type="text" id="nombre" name="nombre" placeholder="Carlos Pérez" required>
                </div>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo Electrónico:</label>
                    <input class="form-control" type="email" id="correo" name="correo" placeholder="usuaio@dominio.com">
                </div>
                <div class="mb-3">
                    <label for="pass" class="form-label">Contraseña:</label>
                    <input class="form-control" type="password" id="pass" name="pass" required>
                </div>
                <div class="mb-3">
                    <label for="repeat-pass" class="form-label">Repetir Contraseña:</label>
                    <input class="form-control" type="password" id="repeat-pass" name="repeat-pass" required>
                </div>
                <div class="mb-3">
                    <label for="fecha" class="form-label">Fecha Nacimiento:</label>
                    <input class="form-control" type="date" id="fecha" name="fecha">
                </div>
                <label class="form-label d-block">Genero:</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="masculino" name="genero" value="masculino" required>
                    <label class="form-check-label" for="masculino">Masculino</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="femenino" name="genero" value="femenino">
                    <label class="form-check-label" for="femenino">Femenino</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="otro" name="genero" value="otro">
                    <label class="form-check-label" for="otro">Otro</label>
                </div>

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                    <label class="form-check-label" for="terms">Acepto los Términos y Condiciones</label>
                </div>

                <button class="btn btn-primary w-100" id="boton" type="submit">Registrarse</button>
            </form>
        </div>
        </div>
    </main>
    <footer class="text-center mt-5">
        &copy; 2025 - Universidad Fidélitas - Ambiente Web Cliente Servidor
    </footer>
</body>
</html>
